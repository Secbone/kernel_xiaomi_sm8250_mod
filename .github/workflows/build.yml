name: Build elish SukiSU kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device codename'
        required: true
        default: 'elish'
      variant:
        description: 'Build variant (ksu or empty)'
        required: true
        default: 'ksu'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl wget bison flex zip bc cpio libssl-dev \
            ccache python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libelf-dev

      - name: Download proton-clang toolchain
        run: |
          mkdir -p "$HOME/proton-clang"
          cd "$HOME/proton-clang"
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip -q 20210522.zip
          ls proton-clang-20210522/bin | head

      - name: Show toolchain info
        run: |
          export PATH="$HOME/proton-clang/proton-clang-20210522/bin:$PATH"
          clang --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          arm-linux-gnueabi-ld --version | head -1

      - name: Debug config check
        run: |
          echo "checking drivers/kernelsu presence after setup will happen during build"

      - name: Build kernel
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 2G
          bash build.sh ${{ github.event.inputs.device }} ${{ github.event.inputs.variant }} 2>&1 | tee build.log

      - name: Show KSU config result
        if: always()
        run: |
          echo "=== out/.config KSU lines ==="
          grep -E "CONFIG_KSU" out/.config 2>/dev/null | head -30 || echo "no out/.config"
          echo "=== kernelsu objs built ==="
          find out/drivers/kernelsu -name "*.o" 2>/dev/null | head -30 || echo "none"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -v Kernel_*_anykernel3_*.zip artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload AnyKernel3 zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elish-sukisu-kernel
          path: artifacts/*.zip
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
